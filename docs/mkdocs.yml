site_name: ASN.1 – JetBrains Plugin
site_description: JetBrains plugin providing language support for ASN.1 (ITU-T X.680) in all IntelliJ-platform IDEs — code and documentation largely created with AI assistance (transparency notice pursuant to the EU AI Act)
site_author: PCSoft

docs_dir: docs
site_dir: ../build/docs

extra_css:
  - stylesheets/extra.css

plugins:
  - search

extra:
  version:
    provider: mike
    alias: true

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      toc_depth: 3

theme:
  name: material
  language: en
  logo: assets/images/logo-header.png
  favicon: assets/images/logo-header.png
  features:
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - File Types: file-types.md
  - API Docs: dokka/html/index.html
  - Licences:
      - Overview: licensing.md
      - Dependencies: licences/index.html
